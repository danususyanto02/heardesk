<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="quality-workflow-title quality-workflow-desc">
<title id="quality-workflow-title">How quality evidence is collected</title><desc id="quality-workflow-desc">Record the code version, run tests and review SonarQube results separately.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#46566D"></path></marker></defs>
<style>text{font-family:'Source Sans 3',Arial,sans-serif} </style>
<rect width="1120" height="720" fill="#FFFFFF"></rect>
<text x="40" y="64" font-size="32" fill="#17243B" text-anchor="start" font-weight="600">How quality evidence is collected</text><text x="40" y="100" font-size="18" fill="#46566D" text-anchor="start" font-weight="400">Record the code version, run tests and review SonarQube results separately.</text>
<line x1="280" y1="252" x2="440" y2="252" stroke="#46566D" stroke-width="1.5" marker-end="url(#arrow)"></line><rect x="40" y="200" width="240" height="104" rx="8" fill="#FFFFFF" stroke="#46566D" stroke-width="1.5"></rect><text x="56" y="232" font-size="20" fill="#17243B" text-anchor="start" font-weight="600">Recorded code version</text><text x="56" y="260" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">Identified by Git commit</text><line x1="680" y1="252" x2="840" y2="252" stroke="#46566D" stroke-width="1.5" marker-end="url(#arrow)"></line><rect x="440" y="200" width="240" height="104" rx="8" fill="#FFFFFF" stroke="#46566D" stroke-width="1.5"></rect><text x="456" y="232" font-size="20" fill="#17243B" text-anchor="start" font-weight="600">Automated tests</text><text x="456" y="260" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">Code, database and browser</text><rect x="840" y="200" width="240" height="104" rx="8" fill="#EEF4FF" stroke="#1463D6" stroke-width="1.5"></rect><text x="856" y="232" font-size="20" fill="#1463D6" text-anchor="start" font-weight="600">SonarQube analysis</text><text x="856" y="260" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">Code findings and coverage</text><text x="40" y="420" font-size="22" fill="#17243B" text-anchor="start" font-weight="400">Passing tests and passing the Quality Gate are separate checks.</text><text x="40" y="460" font-size="18" fill="#46566D" text-anchor="start" font-weight="400">The Quality Gate applies configured rules to the analysis results.</text><line x1="40" y1="648" x2="1080" y2="648" stroke="#CAD3DF"></line>
<text x="40" y="680" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">This is an overview of the evidence flow, not a diagram of the exact Jenkins job stages.</text></svg>