<line x1="280" y1="224" x2="440" y2="224" stroke="#46566D" stroke-width="1.5"></line><line x1="680" y1="224" x2="840" y2="224" stroke="#46566D" stroke-width="1.5"></line><line x1="960" y1="300" x2="960" y2="400" stroke="#46566D" stroke-width="1.5"></line><rect x="40" y="156" width="240" height="144" rx="8" fill="#FFFFFF" stroke="#46566D" stroke-width="1.5"></rect><text x="56" y="188" font-size="20" fill="#17243B" text-anchor="start" font-weight="600">Organization</text><text x="56" y="216" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">id (PK)</text><text x="56" y="240" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">Company workspace</text><rect x="440" y="156" width="240" height="144" rx="8" fill="#FFFFFF" stroke="#46566D" stroke-width="1.5"></rect><text x="456" y="188" font-size="20" fill="#17243B" text-anchor="start" font-weight="600">Site</text><text x="456" y="216" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">id (PK)</text><text x="456" y="240" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">companyId (FK)</text><text x="456" y="264" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">origin / publicKey</text><rect x="840" y="156" width="240" height="144" rx="8" fill="#EEF4FF" stroke="#1463D6" stroke-width="1.5"></rect><text x="856" y="188" font-size="20" fill="#1463D6" text-anchor="start" font-weight="600">Feedback</text><text x="856" y="216" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">siteId (FK)</text><text x="856" y="240" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">submissionId / fingerprint</text><text x="856" y="264" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">trackingHash (nullable)</text><rect x="840" y="400" width="240" height="112" rx="8" fill="#FFFFFF" stroke="#46566D" stroke-width="1.5"></rect><text x="856" y="432" font-size="20" fill="#17243B" text-anchor="start" font-weight="600">PublicReply</text><text x="856" y="460" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">feedbackId / authorId (FK)</text><text x="856" y="484" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">requestId / body</text><rect x="440" y="400" width="240" height="112" rx="8" fill="#FFFFFF" stroke="#46566D" stroke-width="1.5"></rect><text x="456" y="432" font-size="20" fill="#17243B" text-anchor="start" font-weight="600">Private report data</text><text x="456" y="460" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">Attachment: 0..1 per report</text><text x="456" y="484" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">InternalNote: many per report</text><text x="312" y="212" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">1 : N</text><text x="708" y="212" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">1 : N</text><text x="976" y="360" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">1 : N</text><path d="M840,276 H776 Q768,276 768,284 V364 Q768,372 760,372 H616 Q608,372 608,380 V400" fill="none" stroke="#46566D" stroke-width="1.5"></path><line x1="40" y1="648" x2="1080" y2="648" stroke="#CAD3DF"></line>
<text x="40" y="680" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">Private data belongs to Feedback. authorId links to User. 1:N means one report can have many replies.</text></svg>