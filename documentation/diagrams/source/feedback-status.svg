<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="feedback-status-title feedback-status-desc">
<title id="feedback-status-title">What report statuses mean</title><desc id="feedback-status-desc">HearDesk shows the current status, not a timeline of every status change.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#46566D"></path></marker></defs>
<style>text{font-family:'Source Sans 3',Arial,sans-serif} </style>
<rect width="1120" height="720" fill="#FFFFFF"></rect>
<text x="40" y="64" font-size="32" fill="#17243B" text-anchor="start" font-weight="600">What report statuses mean</text><text x="40" y="100" font-size="18" fill="#46566D" text-anchor="start" font-weight="400">HearDesk shows the current status, not a timeline of every status change.</text>
<line x1="240" y1="292" x2="328" y2="292" stroke="#46566D" stroke-width="1.5" marker-end="url(#arrow)"></line><line x1="520" y1="292" x2="608" y2="292" stroke="#46566D" stroke-width="1.5" marker-end="url(#arrow)"></line><line x1="800" y1="292" x2="888" y2="292" stroke="#46566D" stroke-width="1.5" marker-end="url(#arrow)"></line><rect x="48" y="240" width="192" height="104" rx="8" fill="#FFFFFF" stroke="#46566D" stroke-width="1.5"></rect><text x="64" y="272" font-size="20" fill="#17243B" text-anchor="start" font-weight="600">NEW</text><text x="64" y="300" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">Received</text><rect x="328" y="240" width="192" height="104" rx="8" fill="#FFFFFF" stroke="#46566D" stroke-width="1.5"></rect><text x="344" y="272" font-size="20" fill="#17243B" text-anchor="start" font-weight="600">REVIEWING</text><text x="344" y="300" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">Under review</text><rect x="608" y="240" width="192" height="104" rx="8" fill="#EEF4FF" stroke="#1463D6" stroke-width="1.5"></rect><text x="624" y="272" font-size="20" fill="#1463D6" text-anchor="start" font-weight="600">DONE</text><text x="624" y="300" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">Completed</text><rect x="888" y="240" width="192" height="104" rx="8" fill="#FFFFFF" stroke="#46566D" stroke-width="1.5"></rect><text x="904" y="272" font-size="20" fill="#17243B" text-anchor="start" font-weight="600">ARCHIVED</text><text x="904" y="300" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">Archived</text><text x="48" y="420" font-size="22" fill="#17243B" text-anchor="start" font-weight="400">A typical review order, not a required sequence.</text><text x="48" y="460" font-size="18" fill="#46566D" text-anchor="start" font-weight="400">Staff with permission may choose any status, including reopening a report.</text><line x1="40" y1="648" x2="1080" y2="648" stroke="#CAD3DF"></line>
<text x="40" y="680" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">The arrows show a suggested workflow. The application does not force one-way status changes.</text></svg>