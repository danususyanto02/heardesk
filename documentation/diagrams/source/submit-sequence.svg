<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="submit-sequence-title submit-sequence-desc">
<title id="submit-sequence-title">Sending a report without login</title><desc id="submit-sequence-desc">The widget keeps the same request ID and tracking code when retrying unchanged content.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#46566D"></path></marker></defs>
<style>text{font-family:'Source Sans 3',Arial,sans-serif} </style>
<rect width="1120" height="720" fill="#FFFFFF"></rect>
<text x="40" y="64" font-size="32" fill="#17243B" text-anchor="start" font-weight="600">Sending a report without login</text><text x="40" y="100" font-size="18" fill="#46566D" text-anchor="start" font-weight="400">The widget keeps the same request ID and tracking code when retrying unchanged content.</text>
<line x1="160" y1="244" x2="160" y2="612" stroke="#46566D" stroke-width="1.5" stroke-dasharray="6 5"></line><line x1="424" y1="244" x2="424" y2="612" stroke="#46566D" stroke-width="1.5" stroke-dasharray="6 5"></line><line x1="688" y1="244" x2="688" y2="612" stroke="#46566D" stroke-width="1.5" stroke-dasharray="6 5"></line><line x1="952" y1="244" x2="952" y2="612" stroke="#46566D" stroke-width="1.5" stroke-dasharray="6 5"></line><line x1="160" y1="284" x2="424" y2="284" stroke="#46566D" stroke-width="1.5" marker-end="url(#arrow)"></line><text x="292.0" y="272" font-size="16" fill="#46566D" text-anchor="middle" font-weight="400">Send form and code</text><line x1="424" y1="332" x2="688" y2="332" stroke="#46566D" stroke-width="1.5" marker-end="url(#arrow)"></line><text x="556.0" y="320" font-size="16" fill="#46566D" text-anchor="middle" font-weight="400">Checked data and hash</text><line x1="688" y1="380" x2="952" y2="380" stroke="#46566D" stroke-width="1.5" marker-end="url(#arrow)"></line><text x="820.0" y="368" font-size="16" fill="#46566D" text-anchor="middle" font-weight="400">Reserve space and save</text><line x1="952" y1="428" x2="688" y2="428" stroke="#46566D" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"></line><text x="820.0" y="416" font-size="16" fill="#46566D" text-anchor="middle" font-weight="400">New or existing report</text><line x1="688" y1="476" x2="424" y2="476" stroke="#46566D" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"></line><text x="556.0" y="464" font-size="16" fill="#46566D" text-anchor="middle" font-weight="400">Report accepted</text><line x1="424" y1="524" x2="160" y2="524" stroke="#46566D" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"></line><text x="292.0" y="512" font-size="16" fill="#46566D" text-anchor="middle" font-weight="400">Saved tracking code</text><rect x="48" y="156" width="224" height="88" rx="8" fill="#FFFFFF" stroke="#46566D" stroke-width="1.5"></rect><text x="64" y="188" font-size="20" fill="#17243B" text-anchor="start" font-weight="600">Visitor widget</text><rect x="312" y="156" width="224" height="88" rx="8" fill="#FFFFFF" stroke="#46566D" stroke-width="1.5"></rect><text x="328" y="188" font-size="20" fill="#17243B" text-anchor="start" font-weight="600">Feedback API</text><rect x="576" y="156" width="224" height="88" rx="8" fill="#FFFFFF" stroke="#46566D" stroke-width="1.5"></rect><text x="592" y="188" font-size="20" fill="#17243B" text-anchor="start" font-weight="600">Submit operation</text><rect x="840" y="156" width="224" height="88" rx="8" fill="#FFFFFF" stroke="#46566D" stroke-width="1.5"></rect><text x="856" y="188" font-size="20" fill="#17243B" text-anchor="start" font-weight="600">Database</text><line x1="40" y1="648" x2="1080" y2="648" stroke="#CAD3DF"></line>
<text x="40" y="680" font-size="16" fill="#46566D" text-anchor="start" font-weight="400">Matching request IDs and content prevent duplicates. Changed content with the same ID is rejected.</text></svg>